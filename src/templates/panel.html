<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        place-content: center;
        justify-items: center;
        width: 100%;
        height: 100vh;
        background: black;
    }

    .board {
        color: #eee;
        width: 20rem;
        --depth: 10px;
        aspect-ratio: 3/4;
        position: relative;
        animation: rotate 2s cubic-bezier(0.19, 1, 0.22, 1) both;
        transform-style: preserve-3d;
    }

    @keyframes rotate {
        from {
            transform: translateX(-75vw) rotateX(0) rotateY(55deg);
        }

        to {
            transform: translateX(-15vw) rotateX(8deg) rotateY(8deg);
        }
    }

    .panel {
        position: absolute;
        padding: 1rem;
        width: 100%;
        height: 100%;

        &.front {
            background: radial-gradient(#444 50%, #333);
        }

        &.top,
        &.bottom {
            height: var(--depth);
            left: 0;
            transform: rotateX(90deg);
            transform-origin: bottom;
        }

        &.top {
            /* background-color: none; */
            bottom: 100%;
        }

        &.bottom {
            background-color: #444;
            bottom: 0;
        }

        &.left,
        &.right {
            width: var(--depth);
            top: 0;
            transform: rotateY(90deg);
            transform-origin: left;
        }

        &.left {
            background-color: #777;
            left: 0;
        }

        &.right {
            /* background-color: none; */
            left: 100%;
        }
    }
</style>

<template id="board">
    <div class="board">
        <span class="panel front">
            <slot></slot>
        </span>
        <span class="panel top"></span>
        <span class="panel bottom"></span>
        <span class="panel left"></span>
        <span class="panel right"></span>
    </div>
</template>

</html>
