<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
</head>

<body>
    <main>
        <header>
            <h1>Shoe Resizer</h1>
            <span id="size-display">35</span>
        </header>
        <img id="shoe-image" src="chaussures.jpg" alt="shoe">
        <div id="controls">
            <button id="increase-button">+</button>
            <button id="decrease-button">-</button>
            <label for="shoe-size">Shoe Size:</label>
            <input type="range" name="shoe-size" id="shoe-size" min="20" max="60" step="1">
        </div>
    </main>
</body>

</html>
